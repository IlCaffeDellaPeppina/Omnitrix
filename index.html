<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnitrix Kraken</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  body{display:grid;place-items:center}
  canvas{display:block;width:100vmin;height:100vmin}
</style>
</head>
<body>
<canvas id="omni" width="640" height="640"></canvas>

<!-- Contiene la costante IMG_SRC con l'immagine dell'Omnitrix -->
<script src="img.js"></script>

<script>
const params = new URLSearchParams(location.search);
const canvas = document.getElementById('omni');
const ctx = canvas.getContext('2d', {willReadFrequently:true});
const W=640, H=640, cx=W/2, cy=H/2;

// ===== IMPOSTAZIONI DA RITOCCARE =====
const ZOOM = Number(params.get('zoom')) || 4.2;  // più alto = simbolo più grande / più ritagliato
const TEXT_Y = 505;                              // altezza del testo (più alto = più in basso)
const FONT = 'bold 30px system-ui, sans-serif';  // dimensione e stile del testo
// =====================================

const emblemRadius = 320;   // raggio dello schermo circolare
let original=null;
let shown=45;               // temperatura mostrata (smussata)
let targetTemp=45;          // temperatura più alta tra CPU e GPU
let cpuTemp=NaN, gpuTemp=NaN, liqTemp= NaN;
let lastKey='';

const clamp=v=>Math.max(0,Math.min(1,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};

function render(temp){
  if(!original) return;
  const progress=clamp((temp-55)/25);   // 55°C inizio, 80°C copertura totale
  const redMix=clamp((temp-75)/5);      // 75-80°C: da arancione a rosso
  const orange=[255,126,0], red=[255,20,12];
  const target=orange.map((v,k)=>Math.round(v*(1-redMix)+red[k]*redMix));
  const data=new Uint8ClampedArray(original.data);
  const front=1.08-progress*1.16;       // fronte che avanza dal bordo al centro

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=(y*W+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a<8 || g<95 || g<r*1.18 || g<b*1.12) continue;  // solo i pixel verdi
      const d=Math.hypot(x-cx,y-cy)/emblemRadius;
      const amount=smooth(front-0.075,front+0.075,d);
      if(amount<=0) continue;
      data[i]  =Math.round(r*(1-amount)+target[0]*amount);
      data[i+1]=Math.round(g*(1-amount)+target[1]*amount);
      data[i+2]=Math.round(b*(1-amount)+target[2]*amount);
    }
  }
  ctx.putImageData(new ImageData(data,W,H),0,0);

  // Maschera circolare: tutto ciò che è fuori dal cerchio diventa trasparente (nero)
  ctx.save();
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,W/2,0,Math.PI*2); ctx.fill();
  ctx.restore();

  drawText();
}

function drawText(){
  const f=v=>Number.isFinite(v)?Math.round(v)+'°C':'--';
  const txt='CPU '+f(cpuTemp)+'  GPU '+f(gpuTemp)+'  LIQ '+f(liqTemp);
  ctx.save();
  ctx.font=FONT;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const tw=ctx.measureText(txt).width;
  const bw=tw+36, bh=58, bx=cx-bw/2, by=TEXT_Y-bh/2;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,29); else ctx.rect(bx,by,bw,bh);
  ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.fillText(txt,cx,TEXT_Y+2);
  ctx.restore();
}

const image = new Image();
image.onload=()=>{
  ctx.clearRect(0,0,W,H);
  const w=176*ZOOM, h=180*ZOOM;
  ctx.drawImage(image,(W-w)/2,(H-h)/2,w,h);
  original=ctx.getImageData(0,0,W,H);
  render(shown);
};
image.src = IMG_SRC;

// --- LETTURA TEMPERATURA: CAM chiama questa funzione circa ogni secondo ---
window.nzxt = { v1: { onMonitoringDataUpdate: (d) => {
  cpuTemp = d.cpus?.[0]?.temperature;
  gpuTemp = d.gpus?.[0]?.temperature;
  liqTemp = d.kraken?.liquidTemperature;
  const t=[cpuTemp, gpuTemp].filter(Number.isFinite);
  if(t.length) targetTemp=Math.max(...t);   // la più alta tra CPU e GPU
}}};

// --- Modalità test: aggiungi ?debug all'indirizzo ---
if(params.get('debug')!==null){
  const s=document.createElement('input');
  s.type='range'; s.min=35; s.max=80; s.value=45;
  s.style.cssText='position:fixed;bottom:10px;left:10%;width:80%';
  s.oninput=()=>{ targetTemp=cpuTemp=gpuTemp=Number(s.value); liqTemp=Number(s.value)-15; };
  document.body.appendChild(s);
  cpuTemp=gpuTemp=45; liqTemp=30;
}

// Transizione dolce verso la temperatura reale + aggiornamento del testo
setInterval(()=>{
  const key=Math.round(cpuTemp)+'|'+Math.round(gpuTemp)+'|'+Math.round(liqTemp);
  const moving=Math.abs(targetTemp-shown)>=0.1;
  if(!moving && key===lastKey) return;
  lastKey=key;
  if(moving) shown += (targetTemp-shown)*0.25;
  render(shown);
}, 100);
</script>
</body>
</html>
